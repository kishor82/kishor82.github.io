{{- /* 
  Dark theme default fix
  Uses CSS to prevent flash of light theme, then JS to set preference
*/ -}}

{{- /* Inline CSS to default to dark (prevents flash) */ -}}
<style>
  /* Default to dark theme colors until JS loads */
  :root {
    --theme: rgb(29, 30, 32);
    --primary: rgb(218, 218, 219);
    --secondary: rgb(155, 156, 157);
    --tertiary: rgb(65, 66, 68);
    --content: rgb(196, 196, 197);
    --code-bg: rgb(55, 56, 62);
    --border: rgb(51, 51, 51);
  }
</style>

{{- /* Set localStorage preference for first-time visitors */ -}}
<script>
  (function() {
    // First-time visitor: default to dark
    if (localStorage.getItem('pref-theme') === null) {
      localStorage.setItem('pref-theme', 'dark');
    }
    
    // Apply theme class immediately
    var theme = localStorage.getItem('pref-theme');
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else if (theme === 'light') {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
